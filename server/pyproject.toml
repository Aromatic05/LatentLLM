[project]
name = "latentllm"
version = "0.1.0"
description = "Distributed Token/KV-Cache handoff laboratory built on LatentMAS"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "grpcio>=1.68,<2",
  "grpcio-tools>=1.68,<2",
  "protobuf>=5,<7",
  "uvicorn>=0.30,<1",
  "torch>=2.5",
  "transformers>=4.49,<5",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "accelerate>=1.3",
]

[project.scripts]
latentllm = "latentllm.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latentllm"]
